<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdant</title>

  <script>
    window.VERDANT_STAFF_PASSCODE = "verdantadmin";
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.4.1/dist/cdn.min.js"></script>
  <script defer src="app.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09090b;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(16,185,129,0.18), transparent 32%), #09090b;
    }

    .card {
      width: min(900px, 90vw);
      background: #111827;
      border: 1px solid #374151;
      border-radius: 28px;
      padding: 48px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 5vw, 6rem);
      color: #34d399;
    }

    p {
      margin: 0;
      color: #d1d5db;
      font-size: clamp(1.1rem, 2vw, 2rem);
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.15);
      color: #a7f3d0;
      border: 1px solid rgba(52, 211, 153, 0.3);
      font-weight: bold;
    }
  </style>
</head>
<body x-data="{ ready: true }">
  <div class="card">
    <h1>Verdant</h1>
    <p>System ready for the St. Jude awareness feed.</p>
    <div class="badge">Staff passcode: verdantadmin</div>
  </div>
</body>
</html>
