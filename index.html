<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant — Text Network</title>
    <!-- Tailwind CSS for Dark Mode & Matrix Green styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Alpine.js to handle writing, character counting, and replying in-browser -->
    <script defer src="https://jsdelivr.net"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 font-sans flex justify-center p-4 selection:bg-emerald-500/30">

    <!-- Main Container -->
    <div x-data="{
        leafText: '',
        replyingTo: null,
        characterLimit: 350,
        // Load existing leafs from local storage or use defaults
        leafs: JSON.parse(localStorage.getItem('verdant_leafs')) || [
            { id: 1, username: 'dev_zero', displayName: 'Alex', content: 'Welcome to Verdant! Built directly on GitHub Web. The strict 350-character text limit keeps everything fast and minimal.', timestamp: 'Just now', replies: [] }
        ],
        publishLeaf() {
            if (this.leafText.trim() === '' || (this.characterLimit - this.leafText.length) < 0) return;
            
            const newLeaf = {
                id: Date.now(),
                username: 'anonymous_leaf',
                displayName: 'Verdant User',
                content: this.leafText,
                timestamp: 'Just now',
                replies: []
            };

            if (this.replyingTo) {
                this.leafs = this.leafs.map(l => l.id === this.replyingTo ? { ...l, replies: [...l.replies, newLeaf] } : l);
                this.replyingTo = null;
            } else {
                this.leafs = [newLeaf, ...this.leafs];
            }

            localStorage.setItem('verdant_leafs', JSON.stringify(this.leafs));
            this.leafText = '';
        }
    }" class="w-full max-w-2xl border-x border-neutral-800 min-h-screen px-4 py-6">
        
        <!-- Header -->
        <header class="border-b border-neutral-800 pb-4 mb-6">
            <h1 class="text-2xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                🌱 VERDANT <span class="text-xs font-mono bg-neutral-900 border border-neutral-800 px-2 py-0.5 rounded text-neutral-400">Web Build</span>
            </h1>
            <p class="text-sm text-neutral-500 mt-1">Chronological text network. Plant your thoughts.</p>
        </header>

        <!-- Composer Box -->
        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4 mb-8 shadow-xl">
            <!-- Reply Banner -->
            <template x-if="replyingTo">
                <div class="text-xs text-neutral-400 mb-2 flex justify-between items-center bg-neutral-950 px-3 py-1.5 rounded border border-neutral-800">
                    <span x-text="'Replying to Leaf #' + replyingTo"></span>
                    <button @click="replyingTo = null" class="text-red-400 hover:underline cursor-pointer">Cancel</button>
                </div>
            </template>
            
            <textarea 
                x-model="leafText"
                :placeholder="replyingTo ? 'Write your response leaf...' : 'Turn a new Leaf... (What\'s on your mind?)'"
                class="w-full bg-transparent text-neutral-200 placeholder-neutral-600 resize-none outline-none text-base h-24"
            ></textarea>
            
            <div class="flex justify-between items-center border-t border-neutral-800 pt-3 mt-2">
                <!-- Character Counter Matrix Logic -->
                <span 
                    class="text-xs font-mono"
                    :class="(characterLimit - leafText.length) < 0 ? 'text-red-500 font-bold' : ((characterLimit - leafText.length) <= 50 ? 'text-amber-500' : 'text-emerald-400')"
                    x-text="(characterLimit - leafText.length) + ' / ' + characterLimit"
                ></span>
                
                <!-- Action Button -->
                <button 
                    @click="publishLeaf()"
                    :disabled="leafText.trim() === '' || (characterLimit - leafText.length) < 0"
                    class="bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-600 text-neutral-950 font-bold px-4 py-1.5 rounded-full text-sm transition-all duration-200 cursor-pointer disabled:cursor-not-allowed shadow-lg shadow-emerald-500/10"
                    x-text="replyingTo ? 'Reply Leaf' : 'Publish Leaf'"
                ></button>
            </div>
        </div>

        <!-- Chronological Feed Display -->
        <div class="space-y-4">
            <template x-for="leaf in leafs" :key="leaf.id">
                <div class="bg-neutral-900/60 border border-neutral-900 hover:border-neutral-800 rounded-xl p-4 transition-all duration-150">
                    
                    <!-- Profile Layout -->
                    <div class="flex items-center gap-3 mb-2">
                        <img 
                            :src="'https://dicebear.com' + leaf.username" 
                            alt="avatar" 
                            class="w-9 h-9 rounded-lg bg-neutral-800 border border-neutral-700 p-0.5"
                        />
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-semibold text-sm hover:underline cursor-pointer" x-text="leaf.displayName"></span>
                                <span class="text-xs text-neutral-500" x-text="'@' + leaf.username"></span>
                            </div>
                            <span class="text-[11px] font-mono text-neutral-600" x-text="leaf.timestamp"></span>
                        </div>
                    </div>

                    <!-- Text Post Content -->
                    <p class="text-neutral-300 text-[15px] leading-relaxed whitespace-pre-wrap pl-12" x-text="leaf.content"></p>

                    <!-- Reply Button Action -->
                    <div class="mt-3 pl-12 flex items-center gap-6">
                        <button 
                            @click="replyingTo = leaf.id; window.scrollTo({top: 0, behavior: 'smooth'})"
                            class="text-xs text-neutral-500 hover:text-emerald-400 flex items-center gap-1.5 transition-colors cursor-pointer"
                        >
                            💬 <span class="font-mono" x-text="leaf.replies.length + ' Replies'"></span>
                        </button>
                    </div>

                    <!-- Threaded Replies Loop -->
                    <template x-if="leaf.replies.length > 0">
                        <div class="mt-4 pl-12 border-l-2 border-neutral-800 space-y-3">
                            <template x-for="reply in leaf.replies" :key="reply.id">
                                <div class="pt-2">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="font-medium text-xs text-neutral-200" x-text="'@' + reply.username"></span>
                                        <span class="text-[10px] font-mono text-neutral-600" x-text="reply.timestamp"></span>
                                    </div>
                                    <p class="text-xs text-neutral-400 bg-neutral-950/40 p-2.5 rounded-lg border border-neutral-900" x-text="reply.content"></p>
                                </div>
                            </template>
                        </div>
                    </template>

                </div>
            </template>
        </div>

    </div>
</body>
</html>
