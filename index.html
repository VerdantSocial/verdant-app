<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant — Text Network</title>
    <script>
        window.VERDANT_SUPABASE_URL = 'https://szpcjsaurjdylfdlnowx.supabase.co';
        window.VERDANT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6cGNqc2F1cmpkeWxmZGxub3d4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODEwNzQsImV4cCI6MjEwODM1NzA3NH0.J2AZ2cKLc-Vl1R_DDyIXOCeWRyaUi1SEyHaG7MfcF2M';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 font-sans flex justify-center items-center p-4 selection:bg-emerald-500/30" x-data="verdantAuth">

    <template x-if="step === 'email'">
        <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 tracking-wide mb-1">🌱 Join Verdant</h2>
            <p class="text-xs text-neutral-500 mb-6">Enter your email to receive a 6-digit verification code.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-mono text-neutral-400 mb-1">Email Address</label>
                    <input x-model="userEmail" type="email" placeholder="you@example.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-200 placeholder:text-neutral-600 focus:border-emerald-500/60 transition-colors">
                </div>

                <template x-if="errorMessage">
                    <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                </template>

                <button @click="sendMagicCode()" :disabled="isLoading" class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-500 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">
                    <span x-text="isLoading ? 'Sending...' : 'Request Code'"></span>
                </button>

                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-neutral-800"></div>
                    </div>
                    <div class="relative flex justify-center text-[10px] uppercase tracking-[0.25em] text-neutral-500">
                        <span class="bg-neutral-900 px-2">or continue with</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button @click="signInWithProvider('github')" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-medium py-2.5 rounded-xl text-sm transition-colors cursor-pointer">GitHub</button>
                    <button @click="signInWithProvider('google')" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-medium py-2.5 rounded-xl text-sm transition-colors cursor-pointer">Google</button>
                </div>
            </div>
        </div>
    </template>

    <template x-if="step === 'verify'">
        <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 tracking-wide mb-1">📟 Verification Token</h2>
            <p class="text-xs text-neutral-500 mb-6" x-text="'A 6-digit code was transmitted to: ' + userEmail"></p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-mono text-neutral-400 mb-1">6-Digit Code</label>
                    <input x-model="verificationCode" type="text" maxlength="6" placeholder="000000" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 tracking-[0.5em] text-center outline-none text-neutral-200 placeholder:text-neutral-600 focus:border-emerald-500/60 transition-colors">
                </div>

                <template x-if="errorMessage">
                    <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                </template>

                <div class="flex gap-3">
                    <button @click="step = 'email'; errorMessage = ''" class="w-1/3 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-medium py-2.5 rounded-xl text-sm cursor-pointer">Back</button>
                    <button @click="confirmCode()" :disabled="isLoading" class="w-2/3 bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-500 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">
                        <span x-text="isLoading ? 'Verifying...' : 'Verify'"></span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template x-if="step === 'profile'">
        <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 tracking-wide mb-1">🌿 Finish Your Profile</h2>
            <p class="text-xs text-neutral-500 mb-6">Choose your public username and display name.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-mono text-neutral-400 mb-1">Username</label>
                    <input x-model="username" type="text" maxlength="24" placeholder="verdant_user" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-200 placeholder:text-neutral-600 focus:border-emerald-500/60 transition-colors">
                </div>

                <div>
                    <label class="block text-xs uppercase font-mono text-neutral-400 mb-1">Display Name</label>
                    <input x-model="displayName" type="text" maxlength="40" placeholder="Verdant Node" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-200 placeholder:text-neutral-600 focus:border-emerald-500/60 transition-colors">
                </div>

                <template x-if="errorMessage">
                    <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                </template>

                <button @click="saveProfile()" :disabled="isLoading" class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-500 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">
                    <span x-text="isLoading ? 'Saving...' : 'Create Account'"></span>
                </button>
            </div>
        </div>
    </template>

    <template x-if="step === 'feed'">
        <div class="w-full max-w-2xl border-x border-neutral-800 min-h-screen px-4 py-6 align-top self-start">
            <header class="border-b border-neutral-800 pb-4 mb-6 flex justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-wider text-emerald-400">🌱 VERDANT</h1>
                    <p class="text-xs text-neutral-500">Secure Network Session Active</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-sm font-medium text-neutral-200" x-text="displayName || 'Verdant User'"></div>
                        <div class="text-[11px] text-neutral-500" x-text="'@' + (username || 'user')"></div>
                    </div>
                    <button @click="logoutUser()" class="text-xs font-mono border border-neutral-800 px-3 py-1 rounded bg-neutral-900 text-neutral-400 hover:text-red-400 cursor-pointer transition-colors">Logout</button>
                </div>
            </header>

            <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4 mb-8 shadow-xl">
                <template x-if="replyingTo">
                    <div class="text-xs text-neutral-400 mb-2 flex justify-between items-center bg-neutral-950 px-3 py-1.5 rounded border border-neutral-800">
                        <span x-text="'Replying to Leaf #' + replyingTo"></span>
                        <button @click="replyingTo = null" class="text-red-400 hover:underline cursor-pointer">Cancel</button>
                    </div>
                </template>

                <textarea x-model="leafText" :placeholder="replyingTo ? 'Write your response leaf...' : 'Turn a new Leaf... (What\'s on your mind?)'" class="w-full bg-transparent text-neutral-200 placeholder:text-neutral-600 resize-none border-none outline-none min-h-[100px] text-sm"></textarea>

                <div class="flex justify-between items-center border-t border-neutral-800 pt-3 mt-2">
                    <span class="text-xs font-mono" :class="(characterLimit - leafText.length) < 0 ? 'text-red-500 font-bold' : ((characterLimit - leafText.length) <= 50 ? 'text-amber-500' : 'text-neutral-400')" x-text="(characterLimit - leafText.length) + ' chars left'"></span>
                    <button @click="publishLeaf()" :disabled="leafText.trim() === '' || (characterLimit - leafText.length) < 0 || isLoading" class="bg-emerald-500 hover:bg-emerald-400 disabled:bg-neutral-800 disabled:text-neutral-500 text-neutral-950 font-bold px-4 py-2 rounded-xl text-sm transition-all shadow-lg cursor-pointer">Publish</button>
                </div>
            </div>

            <div class="space-y-4">
                <template x-for="leaf in leafs" :key="leaf.id">
                    <div class="bg-neutral-900/60 border border-neutral-900 hover:border-neutral-800 rounded-xl p-4 transition-all duration-150">
                        <div class="flex items-center gap-3 mb-2">
                            <img :src="'https://api.dicebear.com/7.x/identicon/svg?seed=' + leaf.username" alt="avatar" class="w-9 h-9 rounded-lg bg-neutral-800 border border-neutral-700 p-0.5" />
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="font-semibold text-sm hover:underline cursor-pointer" x-text="leaf.displayName"></span>
                                    <span class="text-xs text-neutral-500" x-text="'@' + leaf.username"></span>
                                </div>
                                <span class="text-[11px] font-mono text-neutral-600" x-text="leaf.timestamp"></span>
                            </div>
                        </div>

                        <p class="text-neutral-300 text-[15px] leading-relaxed whitespace-pre-wrap pl-12" x-text="leaf.content"></p>

                        <div class="mt-3 pl-12 flex items-center gap-6">
                            <button @click="toggleLike(leaf.id)" class="text-xs flex items-center gap-1.5 transition-colors cursor-pointer" :class="leaf.liked ? 'text-rose-400' : 'text-neutral-500 hover:text-rose-400'">
                                <span x-text="leaf.liked ? '♥' : '♡'"></span>
                                <span class="font-mono" x-text="leaf.likes + (leaf.likes === 1 ? ' Like' : ' Likes')"></span>
                            </button>

                            <button @click="replyingTo = leaf.id" class="text-xs text-neutral-500 hover:text-emerald-400 flex items-center gap-1.5 transition-colors cursor-pointer">
                                💬 <span class="font-mono" x-text="leaf.replies.length + (leaf.replies.length === 1 ? ' Reply' : ' Replies')"></span>
                            </button>
                        </div>

                        <template x-if="leaf.replies.length > 0">
                            <div class="mt-4 pl-12 border-l-2 border-neutral-800 space-y-3">
                                <template x-for="reply in leaf.replies" :key="reply.id">
                                    <div class="pt-2">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="font-medium text-xs text-neutral-200" x-text="'@' + reply.username"></span>
                                            <span class="text-[10px] font-mono text-neutral-600" x-text="reply.timestamp"></span>
                                        </div>
                                        <p class="text-xs text-neutral-400 bg-neutral-950/40 p-2.5 rounded-lg border border-neutral-900" x-text="reply.content"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </template>

</body>
</html>
