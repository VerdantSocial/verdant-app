<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant — Text Network</title>
    <style>
        [x-cloak] { display: none !important; }
        body { background: radial-gradient(circle at top, rgba(16,185,129,0.16), transparent 30%), #09090b; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.4.1/dist/cdn.min.js"></script>
    <script defer src="app.js"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 font-sans flex justify-center items-center p-4 selection:bg-emerald-500/30" x-data="verdantAuth" x-cloak>
    <div class="w-full max-w-3xl">
        <template x-if="step === 'email'">
            <div class="w-full max-w-md mx-auto bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
                <div class="mb-5">
                    <p class="text-xs uppercase text-emerald-400 font-mono tracking-[0.3em]">Verdant</p>
                    <h2 class="text-2xl font-black text-emerald-400 mt-2">🌱 Join the network</h2>
                    <p class="text-xs text-neutral-500 mt-2">Sign in with Google, GitHub, or email and receive a 6-digit token.</p>
                </div>

                <div class="space-y-3 mb-4">
                    <button @click="signInWithProvider('google')" class="w-full bg-white text-neutral-950 font-bold py-2.5 rounded-xl text-sm hover:bg-neutral-200 transition">Continue with Google</button>
                    <button @click="signInWithProvider('github')" class="w-full bg-neutral-800 text-neutral-100 font-bold py-2.5 rounded-xl text-sm border border-neutral-700 hover:bg-neutral-700 transition">Continue with GitHub</button>
                </div>

                <div class="relative flex items-center my-5">
                    <div class="flex-1 border-t border-neutral-800"></div>
                    <span class="px-3 text-[10px] uppercase tracking-[0.25em] text-neutral-500">or</span>
                    <div class="flex-1 border-t border-neutral-800"></div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">Email Address</label>
                        <input x-model="userEmail" type="email" placeholder="you@example.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-100 placeholder:text-neutral-600">
                    </div>

                    <template x-if="errorMessage">
                        <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                    </template>

                    <button @click="sendMagicCode()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">Send verification code</button>
                </div>
            </div>
        </template>

        <template x-if="step === 'verify'">
            <div class="w-full max-w-md mx-auto bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
                <h2 class="text-xl font-black text-emerald-400 tracking-tight">📟 Verify your email</h2>
                <p class="text-xs text-neutral-500 mt-2 mb-5" x-text="'A 6-digit code was transmitted to: ' + userEmail"></p>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">Verification Code</label>
                        <input x-model="verificationCode" type="text" maxlength="6" placeholder="000000" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 tracking-[0.5em] outline-none text-neutral-100 placeholder:text-neutral-600">
                    </div>

                    <template x-if="errorMessage">
                        <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                    </template>

                    <button @click="confirmCode()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">Verify account</button>
                </div>
            </div>
        </template>

        <template x-if="step === 'profile'">
            <div class="w-full max-w-lg mx-auto bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
                <div class="flex items-center gap-4 mb-6">
                    <img :src="profileAvatarUrl(profile || { username: profileDraft.username || 'verdant', display_name: profileDraft.display_name || 'Verdant User', avatar_url: profileDraft.avatar_url || '' })" class="w-16 h-16 rounded-2xl border border-neutral-700 object-cover bg-neutral-950" alt="Profile avatar">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.3em] text-emerald-400 font-mono">Create profile</p>
                        <h2 class="text-xl font-black text-emerald-400">Design your Verdant identity</h2>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">Username</label>
                        <input x-model="profileDraft.username" type="text" placeholder="garden_guru" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-100 placeholder:text-neutral-600">
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">Display Name</label>
                        <input x-model="profileDraft.display_name" type="text" placeholder="Maya Bloom" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-100 placeholder:text-neutral-600">
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">About Me / Bio</label>
                        <textarea x-model="profileDraft.bio" rows="3" maxlength="180" placeholder="Growing community, ideas, and better neighborhoods." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 outline-none text-neutral-100 placeholder:text-neutral-600"></textarea>
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">Profile Picture URL (optional)</label>
                        <input x-model="profileDraft.avatar_url" type="url" placeholder="https://..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-100 placeholder:text-neutral-600">
                    </div>

                    <template x-if="errorMessage">
                        <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                    </template>

                    <div class="flex gap-3 pt-2">
                        <button @click="saveProfile()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition">Save profile</button>
                        <button @click="logoutUser()" class="px-4 bg-neutral-800 border border-neutral-700 hover:bg-neutral-700 text-neutral-100 rounded-xl text-sm">Log out</button>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="step === 'feed'">
            <div class="w-full max-w-3xl space-y-6">
                <div class="flex items-center justify-between bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-lg font-black text-neutral-950">V</div>
                        <div>
                            <h1 class="text-2xl font-black text-emerald-400 tracking-tight">Verdant</h1>
                            <p class="text-[10px] text-neutral-500 uppercase tracking-[0.25em] font-mono">Text network</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button @click="openStaffPanel()" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 px-3 py-2 rounded-lg text-[10px] font-semibold text-neutral-200 uppercase tracking-[0.2em]">Staff</button>
                        <button @click="logoutUser()" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 px-3 py-2 rounded-lg text-xs font-semibold text-neutral-200">Log out</button>
                    </div>
                </div>

                <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center gap-3 mb-3">
                        <img :src="profileAvatarUrl(profile)" alt="Your avatar" class="w-11 h-11 rounded-xl border border-neutral-700 object-cover bg-neutral-950">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-neutral-100" x-text="profile?.display_name || 'Verdant User'"></h3>
                                <span :class="getBadgeClass(profile)" class="text-[10px] px-2 py-1 rounded-full font-mono uppercase" x-text="getBadgeText(profile)"></span>
                            </div>
                            <p class="text-[10px] text-neutral-500">@<span x-text="profile?.username || 'verdant_user'"></span></p>
                        </div>
                    </div>

                    <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-2">Write a Leaf</label>
                    <textarea x-model="leafText" maxlength="350" rows="3" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 outline-none text-neutral-100 placeholder:text-neutral-600" placeholder="Share what’s growing in your world..."></textarea>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="text-xs text-neutral-500" x-text="(characterLimit - leafText.length) + ' chars remaining'"></span>
                        <button @click="publishLeaf()" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-4 py-2 rounded-xl text-sm shadow-lg">Post</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <template x-for="leaf in leafs" :key="leaf.id">
                        <article :class="profileIsOfficial(leaf.author) ? 'border-amber-400/40 bg-amber-500/5' : profileIsVerified(leaf.author) ? 'border-emerald-400/40 bg-emerald-500/5' : 'border-neutral-800 bg-neutral-900'" class="rounded-2xl border p-4 shadow-xl">
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex items-start gap-3">
                                    <img :src="avatarUrlForAuthor(leaf.author || leaf)" class="w-11 h-11 rounded-xl border border-neutral-700 object-cover bg-neutral-950" alt="Leaf author avatar">
                                    <div>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <h3 class="font-bold text-neutral-100" x-text="(leaf.author && leaf.author.display_name) || leaf.displayName || 'Verdant User'"></h3>
                                            <span :class="getBadgeClass(leaf.author || leaf)" class="text-[10px] px-2 py-1 rounded-full font-mono uppercase" x-text="getBadgeText(leaf.author || leaf)"></span>
                                            <span class="text-[10px] text-emerald-400 font-mono uppercase">@<span x-text="(leaf.author && leaf.author.username) || leaf.username || 'verdant_user'"></span></span>
                                        </div>
                                        <p class="text-[10px] text-neutral-500 mt-1" x-text="leaf.timestamp || 'Just now'"></p>
                                    </div>
                                </div>
                                <button @click="replyingTo = leaf.id" class="text-xs text-emerald-400 hover:text-emerald-300">Reply</button>
                            </div>

                            <p class="mt-3 text-neutral-100 leading-relaxed whitespace-pre-wrap" x-text="leaf.content"></p>

                            <div class="mt-4 flex items-center gap-4 text-xs text-neutral-400">
                                <button @click="toggleLike(leaf.id)" class="inline-flex items-center gap-2 hover:text-emerald-300 transition">
                                    <span>❤️</span><span x-text="(leaf.likes || 0)"></span>
                                </button>
                                <span class="inline-flex items-center gap-2"><span>💬</span><span x-text="(leaf.replies || []).length"></span></span>
                            </div>

                            <template x-if="replyingTo === leaf.id">
                                <div class="mt-4 border-t border-neutral-800 pt-4">
                                    <textarea x-model="leafText" rows="2" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 outline-none text-neutral-100 placeholder:text-neutral-600" placeholder="Write a reply..."></textarea>
                                    <div class="mt-2 flex items-center justify-end gap-2">
                                        <button @click="replyingTo = null" class="text-xs text-neutral-400">Cancel</button>
                                        <button @click="publishLeaf()" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-3 py-2 rounded-lg text-xs">Send reply</button>
                                    </div>
                                </div>
                            </template>

                            <template x-if="leaf.replies && leaf.replies.length">
                                <div class="mt-4 space-y-3 border-t border-neutral-800 pt-4">
                                    <template x-for="reply in leaf.replies" :key="reply.id">
                                        <div class="ml-4 bg-neutral-950 border border-neutral-800 rounded-xl p-3">
                                            <div class="flex items-center gap-2 align-middle">
                                                <img :src="avatarUrlForAuthor(reply.author || reply)" class="w-8 h-8 rounded-lg border border-neutral-700 object-cover bg-neutral-950" alt="Reply avatar">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="font-bold text-neutral-100" x-text="(reply.author && reply.author.display_name) || reply.displayName || 'Verdant User'"></span>
                                                    <span :class="getBadgeClass(reply.author || reply)" class="text-[9px] px-1.5 py-0.5 rounded-full font-mono uppercase" x-text="getBadgeText(reply.author || reply)"></span>
                                                    <span class="text-[10px] text-neutral-500">@<span x-text="(reply.author && reply.author.username) || reply.username || 'verdant_user'"></span></span>
                                                </div>
                                            </div>
                                            <p class="mt-2 text-sm text-neutral-200 whitespace-pre-wrap" x-text="reply.content"></p>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </article>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <template x-if="staffOpen">
        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="w-full max-w-xl bg-neutral-900 border border-neutral-800 rounded-2xl p-5 shadow-2xl">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.25em] font-mono text-emerald-400">Staff panel</p>
                        <h3 class="text-xl font-black text-emerald-400">Verdant moderation</h3>
                    </div>
                    <button @click="closeStaffPanel()" class="text-neutral-400 hover:text-neutral-200">Close</button>
                </div>

                <div class="mb-4">
                    <label class="block text-[10px] uppercase font-mono text-neutral-400 mb-1">Passcode</label>
                    <input x-model="staffPassword" type="password" placeholder="Enter staff passcode" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-100 placeholder:text-neutral-600">
                    <button @click="authenticateStaff()" class="mt-2 bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-4 py-2 rounded-xl text-sm">Unlock staff tools</button>
                </div>

                <div class="space-y-3">
                    <template x-for="item in verificationQueue" :key="item.id">
                        <div class="flex items-center justify-between bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-3">
                            <div>
                                <p class="font-bold text-neutral-100" x-text="item.display_name"></p>
                                <p class="text-[10px] text-neutral-500">@<span x-text="item.username"></span></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button @click="setVerificationBadge(item, 'verified')" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-3 py-2 rounded-lg text-xs">Verified</button>
                                <button @click="setVerificationBadge(item, 'official')" class="bg-amber-400 hover:bg-amber-300 text-neutral-950 font-bold px-3 py-2 rounded-lg text-xs">Official</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
