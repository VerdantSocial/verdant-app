<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdant</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.VERDANT_SUPABASE = {
      url: "https://YOUR_PROJECT_ID.supabase.co",
      anonKey: "YOUR_ANON_KEY",
      siteUrl: window.location.origin
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.4.1/dist/cdn.min.js"></script>
  <script defer src="app.js"></script>
  <style>
    :root {
      --bg: #050505;
      --panel: #0d0f0d;
      --panel-alt: #121812;
      --panel-strong: #0f130f;
      --border: #1d2a1d;
      --text: #edf7ee;
      --muted: #8ba28f;
      --accent: #4ade80;
      --accent-strong: #22c55e;
      --accent-soft: rgba(74, 222, 128, 0.12);
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at top, rgba(74, 222, 128, 0.09), transparent 34%),
        var(--bg);
    }

    .page {
      width: min(960px, 100%);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      margin-bottom: 18px;
    }

    .brand {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--accent);
      letter-spacing: -0.06em;
    }

    .pill {
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(74, 222, 128, 0.25);
      background: rgba(74, 222, 128, 0.08);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .signup-panel,
    .feed-panel {
      padding: 22px;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      background: #0a100b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      outline: none;
      resize: vertical;
    }

    textarea {
      min-height: 100px;
    }

    input:focus, textarea:focus {
      border-color: rgba(74, 222, 128, 0.6);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.08);
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary {
      background: var(--accent);
      color: #051008;
      padding: 12px 18px;
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
    }

    .danger {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fecaca;
      padding: 12px 18px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .error {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fecaca;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
    }

    .profile-preview {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(74, 222, 128, 0.03);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(74, 222, 128, 0.35);
      background: #0a100b;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .composer textarea {
      min-height: 90px;
    }

    .leafs {
      display: grid;
      gap: 16px;
    }

    .leaf {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .leaf-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .userline {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .display-name {
      font-weight: 700;
    }

    .username {
      color: var(--muted);
      font-size: 12px;
    }

    .timestamp {
      font-size: 11px;
      color: var(--muted);
    }

    .leaf-body {
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      margin: 12px 0 14px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(74, 222, 128, 0.04);
      color: var(--text);
    }

    .reply-box {
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .reply-box textarea {
      min-height: 72px;
    }

    .reply-list {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .reply {
      border: 1px solid var(--border);
      background: rgba(74, 222, 128, 0.02);
      border-radius: 12px;
      padding: 12px;
    }

    .reply-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .reply-body {
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .topbar, .header-row, .row { align-items: flex-start; }
      .row { flex-direction: column; }
      .primary, .secondary, .danger { width: 100%; }
    }
  </style>
</head>
<body x-data="verdantApp">
  <div class="page">
    <div class="topbar panel">
      <h1 class="brand">Verdant</h1>
      <div class="pill">Text Network</div>
    </div>

    <template x-if="step === 'signup'">
      <div class="signup-panel panel stack">
        <div>
          <h2 style="margin:0 0 8px; font-size: clamp(1.6rem, 3vw, 2.4rem);" x-text="authMode === 'login' ? 'Welcome back' : 'Create your account'"></h2>
          <p style="margin:0; color: var(--muted);" x-text="authMode === 'login' ? 'Sign in to your Verdant account.' : 'Set up your profile and start posting.'"></p>
        </div>

        <div class="field" x-show="authMode !== 'login'">
          <label>Username</label>
          <input x-model="form.username" type="text" placeholder="yourname" />
        </div>

        <div class="field">
          <label>Email</label>
          <input x-model="form.email" type="email" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label>Password</label>
          <input x-model="form.password" type="password" placeholder="Choose a password" />
        </div>

        <template x-if="authMode !== 'login'">
          <div class="field">
            <label>Bio</label>
            <textarea x-model="form.bio" placeholder="Tell people a little about you..."></textarea>
          </div>
        </template>

        <template x-if="authMode !== 'login'">
          <div class="field">
            <label>Profile picture URL</label>
            <input x-model="form.pfpUrl" type="url" placeholder="https://example.com/avatar.jpg" />
          </div>
        </template>

        <template x-if="errorMessage">
          <div class="error" x-text="errorMessage"></div>
        </template>

        <div class="row">
          <button class="secondary" type="button" @click="authMode === 'login' ? setAuthMode('signup') : setAuthMode('login')" x-text="authMode === 'login' ? 'Need an account? Create one' : 'Already have an account? Log in'"></button>
          <button class="primary" type="button" @click="createAccount()" x-text="authMode === 'login' ? 'Sign in' : 'Continue'"></button>
        </div>
      </div>
    </template>

    <template x-if="step === 'profile'">
      <div class="signup-panel panel stack">
        <div>
          <h2 style="margin:0 0 8px; font-size: clamp(1.6rem, 3vw, 2.4rem);">Finish your profile</h2>
          <p style="margin:0; color: var(--muted);">Add a bio and choose a profile picture.</p>
        </div>

        <div class="profile-preview">
          <img class="avatar" :src="profilePreviewUrl" alt="Profile preview" />
          <div>
            <div class="display-name" x-text="form.username || 'yourname'"></div>
            <div class="username" x-text="form.email || 'you@example.com'"></div>
          </div>
        </div>

        <div class="field">
          <label>Bio</label>
          <textarea x-model="form.bio" placeholder="Tell people a little about you..."></textarea>
        </div>

        <div class="field">
          <label>Profile picture URL</label>
          <input x-model="form.pfpUrl" type="url" placeholder="https://example.com/avatar.jpg" />
        </div>

        <template x-if="errorMessage">
          <div class="error" x-text="errorMessage"></div>
        </template>

        <div class="row">
          <button class="secondary" @click="step = 'signup'">Back</button>
          <button class="primary" @click="finishProfile()">Create profile</button>
        </div>
      </div>
    </template>

    <template x-if="step === 'feed'">
      <div class="feed-panel">
        <div class="header-row">
          <div class="userline">
            <img class="avatar" :src="currentUserAvatar" alt="Profile" />
            <div>
              <div class="display-name" x-text="currentUser.displayName"></div>
              <div class="username">@<span x-text="currentUser.username"></span></div>
            </div>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="secondary" @click="startNewAccount()">Create account</button>
            <button class="danger" @click="logoutUser()">Log out</button>
          </div>
        </div>

        <div class="composer">
          <textarea x-model="leafText" maxlength="350" placeholder="Write a leaf..."></textarea>
          <div class="row" style="margin-top: 12px;">
            <div class="timestamp" x-text="(characterLimit - leafText.length) + ' characters remaining'"></div>
            <button class="primary" @click="publishLeaf()">Post</button>
          </div>
        </div>

        <div class="leafs">
          <template x-for="leaf in leafs" :key="leaf.id">
            <article class="leaf">
              <div class="leaf-head">
                <div class="userline">
                  <div class="display-name" x-text="leaf.displayName"></div>
                  <div class="username">@<span x-text="leaf.username"></span></div>
                </div>
                <div class="timestamp" x-text="leaf.timestamp"></div>
              </div>

              <div class="leaf-body" x-text="leaf.content"></div>

              <div class="info-row">
                <div class="chip">❤️ <span x-text="leaf.likes || 0"></span></div>
                <div class="chip">💬 <span x-text="(leaf.replies || []).length"></span></div>
              </div>

              <div class="row" style="margin-top: 12px;">
                <button class="secondary" @click="toggleLike(leaf.id)">Like</button>
                <button class="secondary" @click="replyingTo = (replyingTo === leaf.id ? null : leaf.id)">Reply</button>
              </div>

              <template x-if="replyingTo === leaf.id">
                <div class="reply-box">
                  <textarea x-model="replyText" placeholder="Write a reply..."></textarea>
                  <div class="row" style="margin-top: 12px;">
                    <div></div>
                    <div style="display:flex; gap:10px;">
                      <button class="secondary" @click="replyingTo = null">Cancel</button>
                      <button class="primary" @click="publishReply(leaf.id)">Send</button>
                    </div>
                  </div>
                </div>
              </template>

              <template x-if="leaf.replies && leaf.replies.length">
                <div class="reply-list">
                  <template x-for="reply in leaf.replies" :key="reply.id">
                    <div class="reply">
                      <div class="reply-head">
                        <span class="display-name" x-text="reply.displayName"></span>
                        <span>@<span x-text="reply.username"></span></span>
                      </div>
                      <div class="reply-body" x-text="reply.content"></div>
                    </div>
                  </template>
                </div>
              </template>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
