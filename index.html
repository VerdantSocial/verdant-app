<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant — Text Network</title>
    <style>
        [x-cloak] { display: none !important; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.4.1/dist/cdn.min.js"></script>
    <script defer src="app.js"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 font-sans flex justify-center items-center p-4 selection:bg-emerald-500/30" x-data="verdantAuth" x-cloak>

    <!-- STEP 1: Enter Email Panel -->
    <template x-if="step === 'email'">
        <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 tracking-wide mb-1">🌱 Join Verdant</h2>
            <p class="text-xs text-neutral-500 mb-6">Enter your email to receive a 6-digit verification code.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-mono text-neutral-400 mb-1">Email Address</label>
                    <input x-model="userEmail" type="email" placeholder="you@example.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 outline-none text-neutral-100 placeholder:text-neutral-600 focus:border-emerald-500 transition-colors">
                </div>
                <template x-if="errorMessage">
                    <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                </template>
                <button @click="sendMagicCode()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">Request code</button>
            </div>
        </div>
    </template>

    <!-- STEP 2: Enter 6-Digit Code Panel -->
    <template x-if="step === 'verify'">
        <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 tracking-wide mb-1">📟 Verification Token</h2>
            <p class="text-xs text-neutral-500 mb-6" x-text="'A 6-digit code was transmitted to: ' + userEmail"></p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-mono text-neutral-400 mb-1">6-Digit Code</label>
                    <input x-model="verificationCode" type="text" maxlength="6" placeholder="000000" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 tracking-[0.5em] text-center outline-none text-neutral-100 placeholder:text-neutral-600 focus:border-emerald-500 transition-colors">
                </div>
                <template x-if="errorMessage">
                    <p class="text-xs text-red-400 bg-red-950/20 border border-red-900/40 px-3 py-2 rounded-lg" x-text="errorMessage"></p>
                </template>
                <button @click="confirmCode()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg cursor-pointer">Verify</button>
            </div>
        </div>
    </template>

    <!-- FEED -->
    <template x-if="step === 'feed'">
        <div class="w-full max-w-2xl space-y-6">
            <div class="flex items-center justify-between bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl">
                <div>
                    <h1 class="text-2xl font-black text-emerald-400 tracking-tight">Verdant</h1>
                    <p class="text-xs text-neutral-500">A social network for the people and the soil.</p>
                </div>
                <button @click="logoutUser()" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 px-3 py-2 rounded-lg text-xs font-semibold text-neutral-200">Log out</button>
            </div>

            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl">
                <label class="block text-xs uppercase font-mono text-neutral-400 mb-2">Write a Leaf</label>
                <textarea x-model="leafText" maxlength="350" rows="3" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 outline-none text-neutral-100 placeholder:text-neutral-600 focus:border-emerald-500 transition-colors resize-none" placeholder="Share what you're growing..."></textarea>
                <div class="mt-3 flex items-center justify-between">
                    <span class="text-xs text-neutral-500" x-text="(characterLimit - leafText.length) + ' chars remaining'"></span>
                    <button @click="publishLeaf()" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-4 py-2 rounded-xl text-sm shadow-lg">Post</button>
                </div>
            </div>

            <div class="space-y-4">
                <template x-for="leaf in leafs" :key="leaf.id">
                    <article class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-neutral-100" x-text="leaf.displayName"></h3>
                                    <span class="text-[10px] text-emerald-400 font-mono uppercase">@<span x-text="leaf.username"></span></span>
                                </div>
                                <p class="text-[10px] text-neutral-500 mt-1" x-text="leaf.timestamp"></p>
                            </div>
                            <button @click="replyingTo = leaf.id" class="text-xs text-emerald-400 hover:text-emerald-300">Reply</button>
                        </div>

                        <p class="mt-3 text-neutral-100 leading-relaxed whitespace-pre-wrap" x-text="leaf.content"></p>

                        <div class="mt-4 flex items-center gap-4 text-xs text-neutral-400">
                            <span>❤️ <span x-text="(leaf.likes || 0)"></span></span>
                            <span>💬 <span x-text="(leaf.replies || []).length"></span></span>
                        </div>

                        <template x-if="replyingTo === leaf.id">
                            <div class="mt-4 border-t border-neutral-800 pt-4">
                                <textarea x-model="leafText" rows="2" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 outline-none text-neutral-100 placeholder:text-neutral-600 focus:border-emerald-500 transition-colors resize-none" placeholder="Write your reply..."></textarea>
                                <div class="mt-2 flex items-center justify-end gap-2">
                                    <button @click="replyingTo = null" class="text-xs text-neutral-400">Cancel</button>
                                    <button @click="publishLeaf()" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold px-3 py-2 rounded-lg text-xs">Send reply</button>
                                </div>
                            </div>
                        </template>

                        <template x-if="leaf.replies && leaf.replies.length">
                            <div class="mt-4 space-y-3 border-t border-neutral-800 pt-4">
                                <template x-for="reply in leaf.replies" :key="reply.id">
                                    <div class="ml-4 bg-neutral-950 border border-neutral-800 rounded-xl p-3">
                                        <div class="flex items-center gap-2">
                                            <span class="font-bold text-neutral-100" x-text="reply.displayName"></span>
                                            <span class="text-[10px] text-neutral-500">@<span x-text="reply.username"></span></span>
                                        </div>
                                        <p class="mt-2 text-sm text-neutral-200 whitespace-pre-wrap" x-text="reply.content"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </article>
                </template>
            </div>
        </div>
    </template>

</body>
</html>
